<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Catch a Fade Chris</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0b0c" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --black:#0b0b0c; --panel:#141416; --panel2:#1b1b1e; --line:#2a2a2e;
            --cream:#efe7d3; --dim:#b8b09c; --red:#a4161a; --red2:#d31f26; --gray:#7d7d82; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--black); color:var(--cream); font-family:Archivo,sans-serif;
           min-height:100svh; padding:24px 16px 60px; }
    .wrap { max-width:560px; margin:0 auto; }
    h1 { font-family:"Bebas Neue"; font-size:34px; letter-spacing:2px; text-align:center; }
    h1 em { font-style:normal; color:var(--red2); }
    .sub { text-align:center; color:var(--gray); font-size:12px; letter-spacing:2px;
           text-transform:uppercase; margin:4px 0 24px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
            padding:18px; margin-bottom:14px; }
    .bk-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
    .bk-name { font-family:"Bebas Neue"; font-size:24px; letter-spacing:1px; }
    .badge { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
             padding:4px 9px; border-radius:3px; white-space:nowrap; }
    .b-booked { background:rgba(164,22,26,.2); color:var(--red2); border:1px solid var(--red); }
    .b-charged { background:rgba(60,160,60,.15); color:#7fca7f; border:1px solid #3a6b3a; }
    .b-no_show { background:rgba(211,31,38,.18); color:var(--red2); border:1px solid #6b2020; }
    .b-cancelled { background:var(--panel2); color:var(--gray); border:1px solid var(--line); }
    .bk-meta { color:var(--dim); font-size:14px; margin:8px 0 4px; line-height:1.6; }
    .bk-meta a { color:var(--cream); text-decoration:none; border-bottom:1px solid var(--red); }
    .bk-notes { color:var(--gray); font-size:13px; font-style:italic; }
    .actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
    button, .btnlike { font-family:Archivo; font-weight:700; font-size:13px; letter-spacing:1px;
      text-transform:uppercase; padding:11px 16px; border-radius:6px; border:1px solid var(--line);
      background:var(--panel2); color:var(--cream); cursor:pointer; transition:.15s; }
    button:hover { border-color:var(--dim); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .btn-red { background:var(--red); border-color:var(--red); }
    .btn-red:hover { background:var(--red2); }
    .charge-row { display:flex; gap:8px; margin-top:12px; }
    .charge-row input { flex:1; background:var(--black); border:1px solid var(--line);
      border-radius:6px; color:var(--cream); font-family:Archivo; font-size:16px;
      padding:10px 12px; min-width:0; }
    .charge-row input:focus { outline:none; border-color:var(--red2); }
    .sect { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gray);
            margin:26px 0 12px; }
    .empty { text-align:center; color:var(--gray); padding:40px 0; font-size:14px; }
    #login { max-width:340px; margin:15vh auto 0; text-align:center; }
    #login input { width:100%; background:var(--panel2); border:1px solid var(--line);
      border-radius:8px; color:var(--cream); font-size:16px; padding:14px;
      margin:16px 0 12px; text-align:center; }
    #login input:focus { outline:none; border-color:var(--red2); }
    #login button { width:100%; }
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(70px);
      background:var(--cream); color:var(--black); font-size:14px; font-weight:600;
      padding:12px 20px; border-radius:999px; opacity:0; transition:.3s; z-index:9; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  </style>
</head>
<body>
  <div id="login">
    <h1>Catch a Fade <em>Admin</em></h1>
    <p class="sub">Charge dashboard</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" />
    <button class="btn-red" id="pw-btn">Unlock</button>
  </div>

  <div class="wrap" id="app" hidden>
    <h1>Catch a Fade <em>Admin</em></h1>
    <p class="sub" id="sub-line">Bookings</p>
    <div id="list"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let KEY = sessionStorage.getItem("cafc_admin_key") || "";
let feeText = "$25";

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),3000); }

async function api(path, body){
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", "x-admin-key": KEY },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(()=>({}));
  if (r.status === 401) { logout(); throw new Error(data.error || "wrong password"); }
  if (!r.ok) throw new Error(data.error || "request failed");
  return data;
}
function logout(){ sessionStorage.removeItem("cafc_admin_key"); KEY="";
  $("#app").hidden = true; $("#login").hidden = false; }

const STATUS_LABEL = { booked:"Booked", charged:"Charged", no_show:"No-show", cancelled:"Cancelled" };

function card(b){
  const done = b.status !== "booked";
  return `<div class="card">
    <div class="bk-top">
      <span class="bk-name">${esc(b.name)}</span>
      <span class="badge b-${b.status}">${STATUS_LABEL[b.status]}${b.chargedCents?` · $${(b.chargedCents/100).toFixed(0)}`:""}</span>
    </div>
    <div class="bk-meta">
      ${esc(b.svc.name)} — $${b.svc.price}${b.svc.priceNote||""}<br>
      ${esc(b.date)} · ${esc(b.time)}<br>
      <a href="sms:${esc(b.phone)}">${esc(b.phone)}</a>
      ${b.address ? `<br>${esc(b.address)}` : ""}
      ${b.cardSaved === false ? "" : ""}
    </div>
    ${b.notes ? `<div class="bk-notes">"${esc(b.notes)}"</div>` : ""}
    ${done ? "" : `
    <div class="charge-row">
      <input type="number" min="1" step="1" value="${b.svc.price}" id="amt-${b.id}" />
      <button class="btn-red" onclick="charge('${b.id}')">Charge</button>
    </div>
    <div class="actions">
      <button onclick="noShow('${b.id}')">No-show ${feeText}</button>
      <button onclick="setStatus('${b.id}','cancelled')">Cancel</button>
    </div>`}
  </div>`;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(){
  const data = await api("/api/admin/bookings");
  feeText = data.noShowFee || feeText;
  $("#sub-line").textContent = data.stripe
    ? "Bookings · Stripe connected" : "Bookings · Stripe NOT connected (charges off)";
  const up = data.bookings.filter(b => b.status === "booked");
  const done = data.bookings.filter(b => b.status !== "booked");
  $("#list").innerHTML =
    `<div class="sect">Upcoming (${up.length})</div>` +
    (up.map(card).join("") || `<div class="empty">No upcoming bookings.</div>`) +
    `<div class="sect">History (${done.length})</div>` +
    (done.map(card).join("") || `<div class="empty">Nothing yet.</div>`);
}

window.charge = async (id) => {
  const amt = $(`#amt-${id}`).value;
  if (!confirm(`Charge $${amt} to this client's saved card?`)) return;
  try {
    await api("/api/admin/charge", { bookingId: id, amount: amt });
    toast(`Charged $${amt} ✓`);
    load();
  } catch (e) { toast(e.message); }
};
window.noShow = async (id) => {
  const amt = feeText.replace(/[^0-9.]/g, "");
  if (!confirm(`Mark no-show and charge the ${feeText} fee?`)) return;
  try {
    await api("/api/admin/charge", { bookingId: id, amount: amt });
    await api("/api/admin/status", { bookingId: id, status: "no_show" });
    toast(`No-show fee ${feeText} charged`);
    load();
  } catch (e) {
    if (confirm(`${e.message}\n\nMark as no-show anyway?`)) {
      await api("/api/admin/status", { bookingId: id, status: "no_show" });
      load();
    }
  }
};
window.setStatus = async (id, s) => {
  try { await api("/api/admin/status", { bookingId: id, status: s }); load(); }
  catch (e) { toast(e.message); }
};

$("#pw-btn").addEventListener("click", () => {
  KEY = $("#pw").value.trim();
  sessionStorage.setItem("cafc_admin_key", KEY);
  enter();
});
$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#pw-btn").click(); });

async function enter(){
  if (!KEY) { $("#login").hidden = false; return; }
  try { await load(); $("#login").hidden = true; $("#app").hidden = false; }
  catch (e) { toast(e.message); $("#login").hidden = false; }
}
enter();
</script>
</body>
</html>
